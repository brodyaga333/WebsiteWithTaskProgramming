<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачи по программированию</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Форма добавления задачи -->
        <div class="add-problem">
            <h2>Добавить задачу</h2>
            <input type="text" id="problem-title" placeholder="Название">
            <textarea id="problem-description" placeholder="Описание"></textarea>
            <textarea id="problem-code" placeholder="Шаблон кода"></textarea>
            <button onclick="addProblem()">📥 Добавить</button>
        </div>

        <!-- Список задач -->
        <h1>Список задач</h1>
        <button onclick="loadProblems()">🔄 Обновить</button>
        <div id="problems-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
